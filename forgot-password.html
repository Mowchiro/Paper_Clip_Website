<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paper Clip – Forgot Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Raleway:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
    .field-group {
      width: 100%;
      display: flex;
      max-width: 420px;
      flex-direction: column;
      gap: 0.35rem;
    }

    /* POPUP STYLES */
    .popup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: none; 
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .popup-box {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      text-align: center;
      max-width: 350px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      animation: popIn 0.3s ease;
    }

    .popup-box h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      margin-bottom: 10px;
    }

    .popup-box p {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 20px;
    }

    .btn-close {
      text-decoration: none;
      background: gray; 
      color: white;
      padding: 10px 25px;
      border-radius: 5px;
      font-weight: 600;
      display: inline-block;
    }

    
    #success:target {
      display: flex;
    }

    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
</style>
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="logo">
    <img src="./assets/logo.png" height="45px" width="90px" />
  </a>
</nav>

<div class="paper-bg">
  <div class="auth-card">
    <div class="lock-icon">
        <img src="./assets/lock-icon.png" height="200px" width="150px">
    </div>
    <h1>FORGOT PASSWORD</h1>

    <div class="field-group" style="width:100%">
      <label>EMAIL</label>
      <input type="email" placeholder="eg. sample123@gmail.com">
    </div>

    <a href="#success" class="btn-black" style="text-decoration:none; text-align:center; display:block; width:100%; box-sizing:border-box;">SEND EMAIL</a>

    <a href="login.html" class="auth-link">< Back to Login</a>
  </div>
</div>

<div id="success" class="popup-overlay">
  <div class="popup-box">
    <div style="font-size: 3rem; margin-bottom: 10px;"><img src="./assets/email1.png" width="50rem" height="50rem"></div>
    <h2>Email Sent</h2>
    <p>Please check your inbox for the password reset verification link.</p>
    <a href="#" class="btn-close">DONE</a> </div>
</div>

</body>
</html>
