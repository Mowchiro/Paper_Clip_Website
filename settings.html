<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Clip – Settings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Raleway:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
<style>
.settings-container {
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.settings-card {
    background: #fff;
    border: 1px solid #eee;
    border-radius: 8px;
    padding: 20px;
}

.settings-card h4 {
    margin-top: 0;
    margin-bottom: 20px;
    border-bottom: 1px solid #f0f0f0;
    padding-bottom: 10px;
    font-family: 'Raleway', sans-serif;
    color: #444;
}

.form-group {
    margin-bottom: 15px;
    display: flex;
    flex-direction: column;
}

.form-group label {
    font-size: 0.8rem;
    font-weight: 600;
    margin-bottom: 5px;
    color: #666;
}

.form-group input[type="text"],
.form-group input[type="email"],
.form-group input[type="password"] {
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 4px;
    font-family: 'Raleway', sans-serif;
}

.checkbox-group {
    flex-direction: row;
    align-items: center;
    gap: 10px;
}

.checkbox-group label {
    margin-bottom: 0;
    cursor: pointer;
}

.save-btn {
    background-color: #404040;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 4px;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.8rem;
    transition: background 0.2s;
}

.save-btn:hover {
    background-color: #b8c8b0;
    color: #1a1a1a;
}
</style>
</head>
<body>

<!-- NAVBAR-->
<nav class="navbar">
    <a href="index.html" class="logo">
        <img src="./assets/logo.png" height="45px" width="90px" />
    </a>
    <ul class="nav-links">
        <li><a href="index.html">HOME</a></li>
        <li><a href="shop.html">SHOP</a></li>
        <li><a href="about.html">ABOUT</a></li>
        <li><a href="contact.html">CONTACT</a></li>
    </ul>
    <div class="nav-right">
        <div class="search-bar">
            <img src="./assets/search-icon.png" width="16px" height="16px" />
            <input type="text" placeholder="Search..." />
            <button class="clear-btn">✕</button>
        </div>
        <a href="profile.html"><img src="./assets/profile-icon.png" width="30px" height="30px" class="nav-icon" /></a>
    </div>
</nav>

<h1 class="dashboard-title">DASHBOARD</h1>

<div class="dashboard-layout">
    <nav class="sidebar">
        <a href="dashboard.html">ADMIN DASHBOARD</a>
        <a href="inventory.html">INVENTORY</a>
        <a href="order-tracker.html">ORDER TRACKER</a>
        <a href="settings.html" class="active">SETTINGS</a>
    </nav>

    <div class="dashboard-content">
        <div class="dash-inner">
            <div class="dash-section-header">
                <h3>ACCOUNT SETTINGS</h3>
            </div>

            <div class="settings-container">
                <!-- Profile Settings Section -->
                <section class="settings-card">
                    <h4>Edit Profile</h4>
                    <form>
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" value="Paper Clip Admin">
                        </div>
                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" value="admin@paperclip.ph">
                        </div>
                        <div class="form-group">
                            <label>Contact Number</label>
                            <input type="text" value="+63 901 234 356">
                        </div>
                        <button type="button" class="save-btn">Update Profile</button>
                    </form>
                </section>

                <section class="settings-card">
                    <h4>Change Password</h4>
                    <form>
                        <div class="form-group">
                            <label>Current Password</label>
                            <input type="password" placeholder="••••••••">
                        </div>
                        <div class="form-group">
                            <label>New Password</label>
                            <input type="password" placeholder="New password">
                        </div>
                        <div class="form-group">
                            <label>Confirm New Password</label>
                            <input type="password" placeholder="Confirm password">
                        </div>
                        <button type="button" class="save-btn">Change Password</button>
                    </form>
                </section>

                <section class="settings-card">
                    <h4>Store Preferences</h4>
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="notify" checked>
                        <label for="notify">Enable Email Notifications for New Orders</label>
                    </div>
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="inventory-alert">
                        <label for="inventory-alert">Notify when stock is low (below 5 units)</label>
                    </div>
                </section>
            </div>
        </div>
    </div>
</div>

</body>
</html>
